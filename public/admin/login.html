<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Administration - AMIBIOMED</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100" style="background: linear-gradient(135deg, #1F2428 0%, #0074BC 100%);">

  <div class="container" style="max-width: 440px;">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="bg-dark p-4 text-center border-bottom border-4 border-success">
        <img src="../img/logo/amibiomed-logo.png" alt="AMIBIOMED" style="height: 55px;" onerror="this.onerror=null; this.src='/img/logo/logo.png';">
        <h4 class="text-white fw-bold mt-2 m-0">Espace Administration</h4>
        <small class="text-success fw-bold">AMIBIOMED Back-Office</small>
      </div>

      <div class="card-body p-4">
        <div id="login-alert" class="d-none mb-3"></div>

        <form id="admin-login-form">
          <div class="mb-3">
            <label for="email" class="form-label fw-bold small text-muted">IDENTIFIANT / EMAIL ADMIN</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fa-solid fa-user-shield text-muted"></i></span>
              <input type="email" id="email" class="form-control" required placeholder="qcmuca@gmail.com" value="qcmuca@gmail.com">
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-bold small text-muted">MOT DE PASSE</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
              <input type="password" id="password" class="form-control" required placeholder="••••••••" value="Amibiomed@2026!">
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <span class="small text-muted">Accès réservé aux administrateurs</span>
            <a href="#" id="show-forgot-btn" class="text-decoration-none small text-success fw-bold">
              <i class="fa-solid fa-key me-1"></i>Mot de passe oublié ?
            </a>
          </div>

          <button type="submit" id="login-btn" class="btn-amibiomed-primary w-100 justify-content-center py-2 fs-6">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Se Connecter au Back-Office
          </button>
        </form>

        <!-- FORMULAIRE MOT DE PASSE OUBLIÉ -->
        <div id="forgot-password-box" class="d-none">
          <div class="text-center mb-3">
            <h5 class="fw-bold text-dark mb-1"><i class="fa-solid fa-shield-halved text-success me-2"></i>Réinitialisation d'accès</h5>
            <p class="small text-muted">Recevez un code sécurisé par e-mail pour définir votre nouveau mot de passe.</p>
          </div>

          <!-- Étape 1 : Demande de Code -->
          <form id="forgot-step1-form">
            <div class="mb-3">
              <label for="forgot-email" class="form-label fw-bold small text-muted">E-MAIL DU COMPTE ADMIN</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                <input type="email" id="forgot-email" class="form-control" required placeholder="admin@amibiomed.ma">
              </div>
            </div>
            <button type="submit" id="send-code-btn" class="btn-amibiomed-primary w-100 justify-content-center py-2 mb-2">
              <i class="fa-solid fa-paper-plane me-2"></i> Envoyer le code à 6 chiffres
            </button>
          </form>

          <!-- Étape 2 : Saisie du Code & Nouveau Mot de Passe -->
          <form id="forgot-step2-form" class="d-none">
            <div class="alert alert-info py-2 small mb-3">
              <i class="fa-solid fa-circle-info me-1"></i> Code envoyé à <strong id="target-email-disp"></strong>. Vérifiez votre boîte mail.
            </div>

            <div class="mb-3">
              <label for="reset-code" class="form-label fw-bold small text-muted">CODE DE VÉRIFICATION (6 CHIFFRES)</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-hashtag text-muted"></i></span>
                <input type="text" id="reset-code" class="form-control text-center fw-bold fs-5" maxlength="6" required placeholder="123456" style="letter-spacing: 4px;">
              </div>
            </div>

            <div class="mb-3">
              <label for="new-password" class="form-label fw-bold small text-muted">NOUVEAU MOT DE PASSE</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" id="new-password" class="form-control" minlength="6" required placeholder="Nouveau mot de passe">
              </div>
            </div>

            <div class="mb-3">
              <label for="confirm-password" class="form-label fw-bold small text-muted">CONFIRMER LE MOT DE PASSE</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" id="confirm-password" class="form-control" minlength="6" required placeholder="Confirmer">
              </div>
            </div>

            <button type="submit" id="reset-pass-btn" class="btn-amibiomed-primary w-100 justify-content-center py-2 mb-2">
              <i class="fa-solid fa-check me-2"></i> Valider le nouveau mot de passe
            </button>
          </form>

          <div class="text-center mt-3">
            <a href="#" id="back-to-login-btn" class="text-decoration-none small text-muted">
              <i class="fa-solid fa-arrow-left me-1"></i> Retour à la connexion
            </a>
          </div>
        </div>
      </div>

      <div class="card-footer bg-light text-center py-3">
        <small class="text-muted"><a href="/" class="text-decoration-none text-muted"><i class="fa-solid fa-arrow-left me-1"></i>Retour au site public</a></small>
      </div>
    </div>
  </div>

  <script src="../js/admin.js"></script>
</body>
</html>
